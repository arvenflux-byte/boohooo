<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>&nbsp;</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }
  video {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
             env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    object-fit: contain;
    object-position: center;
    background: #000000;
    pointer-events: none;
  }
</style>
</head>
<body>
<video id="v" autoplay muted loop playsinline preload="auto"
       disablepictureinpicture disableremoteplayback></video>
<script>
  const VIDEO_URL = "./media.mp4";
  const video = document.getElementById("v");

  function fail() {
    video.style.visibility = "hidden"; // layar tetap hitam polos
  }

  function start() {
    video.muted = true;
    const p = video.play();
    if (p !== undefined) {
      p.then(function () {
        video.style.visibility = "visible";
      }).catch(fail);
    }
  }

  video.muted = true;
  video.addEventListener("error", fail);
  video.src = VIDEO_URL;
  video.load();
  start();

  // Pemutaran ulang yang andal setelah refresh / kembali ke tab
  window.addEventListener("pageshow", start);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && video.paused) start();
  });
  video.addEventListener("pause", function () {
    if (!document.hidden) start();
  });
</script>
</body>
</html>
